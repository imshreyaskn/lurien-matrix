version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: llm_mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password_change_me
    command: ["--auth"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: llm_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "password_change_me"]
    restart: unless-stopped

volumes:
  mongo_data:
